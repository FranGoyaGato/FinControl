name: Deploy FinControl to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-fincontrol
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH build & up
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          command_timeout: 20m
          script: |
            set -euo pipefail

            APP_DIR=/opt/fincontrol
            REPO_URL="https://github.com/${{ github.repository }}.git"
            BRANCH="${{ github.ref_name }}"

            echo "==> Deploying $GITHUB_REPOSITORY@$BRANCH into $APP_DIR"

            # 1. First run: clone. Later runs: fast-forward.
            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$APP_DIR"
              git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch --all --prune
            git reset --hard "origin/$BRANCH"

            # 2. .env must already exist on the VPS (never in the repo).
            if [ ! -f "$APP_DIR/.env" ]; then
              echo "!! Missing $APP_DIR/.env — create it from .env.example and re-run."
              exit 1
            fi

            # 3. Build + roll containers (zero-downtime for frontend/backend).
            docker compose pull  || true
            docker compose build --pull
            docker compose up -d --remove-orphans

            # 4. House-keeping.
            docker image prune -f
            docker compose ps
