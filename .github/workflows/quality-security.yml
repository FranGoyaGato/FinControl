name: quality-security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"

      - run: corepack enable

      - name: lint
        run: bash scripts/ci/lint

  security:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"

      - run: corepack enable

      - name: security
        run: bash scripts/ci/security

  quality-security:
    needs: [lint, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: resumen
        run: |
          echo "lint: ${{ needs.lint.result }}"
          echo "security: ${{ needs.security.result }} (continue-on-error: deuda heredada conocida, ver AGENTS.md)"
          if [ "${{ needs.lint.result }}" != "success" ]; then
            exit 1
          fi
