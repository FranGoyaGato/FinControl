services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: fincontrol/backend:latest
    container_name: fincontrol-backend
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "8001"
    networks:
      - goya_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Empty → frontend uses relative /api/* (same origin, Caddy fronts it).
        REACT_APP_BACKEND_URL: ""
    image: fincontrol/frontend:latest
    container_name: fincontrol-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - goya_net

networks:
  # Same external network your /opt/infra stack uses so we can reach
  # goya-mongo and be reached by goya-caddy by service name.
  goya_net:
    external: true
