services:
  mongo:
    image: mongo:7
    container_name: fincontrol-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS}
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    # Not exposed on the host — only reachable from the internal network.

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: fincontrol/backend:latest
    container_name: fincontrol-backend
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "8001"
    depends_on:
      - mongo
    networks:
      - internal
      # `web` is the external Docker network your central Caddy container lives on.
      - web

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Empty → frontend uses relative /api/* (same origin, Caddy fronts it).
        REACT_APP_BACKEND_URL: ""
    image: fincontrol/frontend:latest
    container_name: fincontrol-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - internal
      - web

volumes:
  mongo_data:

networks:
  internal:
    driver: bridge
  # Same network your central `caddy` container uses (verified via
  # `docker inspect caddy` → "web"). External so we don't try to create it.
  web:
    external: true
